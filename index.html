<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#83d9f1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mango World — DreamTech Studio</title>
<style>
  *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#142d22;font-family:system-ui,Arial}
  body{display:flex;align-items:center;justify-content:center}
  #wrap{position:relative;width:min(100vw,900px);height:min(100vh,600px);background:#83d9f1;overflow:hidden}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #hud{position:absolute;inset:12px 14px auto 14px;display:flex;justify-content:space-between;align-items:center;color:#143b2b;font-weight:800;text-shadow:0 1px 0 #fff8;pointer-events:none}
  .pill{background:#fff9;border:2px solid #fff;border-radius:999px;padding:6px 12px}
  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#103b2c88}
  #panel{width:min(88%,430px);background:#fff4d8;border:5px solid #fff;border-radius:24px;padding:24px;text-align:center;color:#24452e;box-shadow:0 10px 0 #29553b}
  h1{margin:0 0 8px;font-size:clamp(28px,7vw,46px)} p{line-height:1.4}
  button{border:0;border-radius:999px;background:#ff9e27;color:#47280b;font-size:19px;font-weight:900;padding:13px 26px;box-shadow:0 5px 0 #c56816;touch-action:manipulation}
  #controls{position:absolute;bottom:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
  .pad{display:flex;gap:12px}.ctrl{pointer-events:auto;width:66px;height:66px;border-radius:20px;background:#fff9;border:3px solid #fff;color:#21442e;font-size:27px;box-shadow:0 4px 0 #49765a}
  #jump{width:82px;height:82px;background:#ffcf52}
  #hint{position:absolute;bottom:105px;left:0;right:0;text-align:center;color:#17442d;font-weight:800;text-shadow:0 1px 0 white;pointer-events:none}
</style>
</head>
<body>
<div id="wrap">
 <canvas id="game" width="900" height="600" aria-label="Mango World game"></canvas>
 <div id="hud"><div class="pill">🥭 MANGO WORLD</div><div class="pill">⭐ <span id="score">0</span></div><div class="pill">❤️ <span id="lives">3</span></div></div>
 <div id="hint">Hold ◀ ▶ to move • Tap JUMP to leap</div>
 <div id="controls"><div class="pad"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div><button class="ctrl" id="jump">⬆</button></div>
 <div id="overlay"><div id="panel"><h1>🥭 Mango World</h1><p><b>DreamTech Studio</b><br>Run, jump, collect stars and dodge the spiky obstacles!</p><p>Use the arrow buttons to move and the yellow button to jump.</p><button id="start">PLAY NOW</button></div></div>
</div>
<script>
(()=>{
const c=document.getElementById('game'),ctx=c.getContext('2d');
const scoreEl=document.getElementById('score'), livesEl=document.getElementById('lives'), overlay=document.getElementById('overlay'), startBtn=document.getElementById('start');
let running=false,score=0,lives=3,keys={left:false,right:false},camera=0,frame=0;
const world={ground:500,length:3200};
const player={x:90,y:400,vx:0,vy:0,w:48,h:58,onGround:false,inv:0};
let stars=[],spikes=[];
function reset(){score=0;lives=3;camera=0;frame=0;player.x=90;player.y=400;player.vx=0;player.vy=0;player.inv=0;
 stars=Array.from({length:22},(_,i)=>({x:260+i*132,y:360-(i%3)*55,taken:false}));
 spikes=[650,1050,1450,1900,2350,2780].map(x=>({x,w:38,h:34}));updateHud();}
function updateHud(){scoreEl.textContent=score;livesEl.textContent=lives;}
function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
function drawBackground(){ctx.fillStyle='#83d9f1';ctx.fillRect(0,0,900,600);
 // sun
 ctx.fillStyle='#ffe77a';ctx.beginPath();ctx.arc(760,105,48,0,Math.PI*2);ctx.fill();
 // distant hills
 for(let i=0;i<6;i++){let x=((i*220-camera*.22)%1200+1200)%1200-150;ctx.fillStyle=i%2?'#70c985':'#55b978';ctx.beginPath();ctx.ellipse(x,470,180,120,0,Math.PI,Math.PI*2);ctx.fill();}
 // clouds
 for(let i=0;i<5;i++){let x=((i*250-camera*.12)%1100+1100)%1100-100;ctx.fillStyle='#ffffffcc';ctx.beginPath();ctx.arc(x,115+(i%2)*45,25,0,7);ctx.arc(x+28,105+(i%2)*45,32,0,7);ctx.arc(x+58,118+(i%2)*45,23,0,7);ctx.fill();}
}
function drawGround(){ctx.fillStyle='#8bce55';ctx.fillRect(0,world.ground,900,100);ctx.fillStyle='#4e9d43';ctx.fillRect(0,world.ground,900,12);
 for(let x=-((camera*1.1)%55);x<950;x+=55){ctx.fillStyle='#65b84a';ctx.beginPath();ctx.arc(x,world.ground+20,5,0,7);ctx.fill();}
}
function drawMango(){let x=player.x-camera,y=player.y;if(player.inv>0&&Math.floor(frame/5)%2===0)return;
 ctx.save();ctx.translate(x+24,y+28);ctx.rotate(Math.max(-.15,Math.min(.15,player.vx*.025)));
 // leaf
 ctx.fillStyle='#26964c';ctx.beginPath();ctx.ellipse(4,-31,15,7,-.55,0,Math.PI*2);ctx.fill();
 // body
 let g=ctx.createLinearGradient(-20,-25,20,28);g.addColorStop(0,'#ffe56b');g.addColorStop(.55,'#ffb52f');g.addColorStop(1,'#ed7622');
 ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,-27);ctx.bezierCurveTo(30,-28,30,15,7,29);ctx.bezierCurveTo(-18,35,-31,5,-20,-14);ctx.bezierCurveTo(-15,-25,-7,-28,0,-27);ctx.fill();
 ctx.fillStyle='#38251c';ctx.beginPath();ctx.arc(-8,-3,3.2,0,7);ctx.arc(8,-3,3.2,0,7);ctx.fill();
 ctx.strokeStyle='#71351e';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,5,8,.15,Math.PI-.15);ctx.stroke();
 // feet
 ctx.strokeStyle='#6a451d';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-9,25);ctx.lineTo(-12,31);ctx.moveTo(9,25);ctx.lineTo(12,31);ctx.stroke();
 ctx.restore();
}
function drawItems(){stars.forEach(s=>{if(s.taken)return;let x=s.x-camera;if(x<-30||x>930)return;ctx.save();ctx.translate(x,s.y);ctx.fillStyle='#ffe14a';ctx.strokeStyle='#d68a17';ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,r=i%2?9:19;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();});
 spikes.forEach(o=>{let x=o.x-camera;if(x<-60||x>940)return;ctx.fillStyle='#d94b49';ctx.strokeStyle='#8d292b';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,world.ground);ctx.lineTo(x+o.w/2,world.ground-o.h);ctx.lineTo(x+o.w,world.ground);ctx.closePath();ctx.fill();ctx.stroke();});
}
function update(){if(!running)return;frame++;
 if(keys.left)player.vx-=.55;if(keys.right)player.vx+=.55;player.vx*=.86;player.vx=Math.max(-5,Math.min(5,player.vx));
 player.x+=player.vx;if(player.x<0)player.x=0;
 player.vy+=.58;player.y+=player.vy;if(player.y+player.h>=world.ground){player.y=world.ground-player.h;player.vy=0;player.onGround=true;}else player.onGround=false;
 if(player.inv>0)player.inv--;
 stars.forEach(s=>{if(!s.taken&&Math.abs((player.x+24)-s.x)<32&&Math.abs((player.y+28)-s.y)<38){s.taken=true;score+=10;updateHud();}});
 spikes.forEach(o=>{if(player.inv===0&&player.x+42>o.x&&player.x+7<o.x+o.w&&player.y+player.h>world.ground-o.h+5){lives--;player.inv=90;player.vy=-7;updateHud();if(lives<=0){running=false;showEnd('Game over!');}}});
 camera=Math.max(0,Math.min(world.length-900,player.x-260));
 if(player.x>world.length-100){running=false;showEnd('You finished the level!');}
}
function showEnd(msg){overlay.style.display='flex';document.querySelector('#panel h1').textContent=msg;document.querySelector('#panel p').innerHTML='You collected <b>'+score+'</b> points!<br>Ready for another run?';startBtn.textContent='PLAY AGAIN';}
function draw(){drawBackground();drawGround();drawItems();drawMango();requestAnimationFrame(draw);}
function loop(){update();setTimeout(loop,16);}
function jump(){if(running&&player.onGround){player.vy=-13;player.onGround=false;}}
function bindHold(id,key){let b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,e=>{keys[key]=false;}));}
bindHold('left','left');bindHold('right','right');document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump();});
c.addEventListener('pointerdown',e=>{if(running)jump();});
startBtn.addEventListener('click',()=>{reset();overlay.style.display='none';document.querySelector('#panel h1').textContent='🥭 Mango World';running=true;});
reset();draw();loop();
})();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
}
</script>
</body></html>
